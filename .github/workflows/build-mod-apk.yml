# dsh-go mod: build an arm64 APK with its own applicationId
# (io.github.ccch1mneyyy.dsh_app.mod) so the untouched original app keeps its data.
# Manual only: Actions → Build mod APK → Run workflow.
name: Build mod APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Signing key (fixed, so later builds upgrade in place)
        run: |
          base64 -d .github/mod-signing.p12.b64 > "$RUNNER_TEMP/mod.p12"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/mod.p12
          storePassword=dshgomod2026
          keyAlias=dshgomod
          keyPassword=dshgomod2026
          EOF
          ls -l "$RUNNER_TEMP/mod.p12"

      - name: Bundle runtime from the official release
        run: |
          # runtime/build-runtime.sh 要跑整套 rootfs 构建，CI 里太慢；
          # 同版本的官方包里有现成的 rootfs，直接取过来，gradle 从 runtime/out 读。
          mkdir -p runtime/out/arm64-v8a/assets/runtime
          curl -fL --retry 5 -o /tmp/official.apk \
            https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.0.10/dsh-go-1.0.10-arm64.apk
          unzip -q -o /tmp/official.apk 'assets/runtime/*' -d /tmp/rt
          cp -a /tmp/rt/assets/runtime/. runtime/out/arm64-v8a/assets/runtime/
          # proot 那四个 .so 也在 runtime/out 里（jniLibs），同样从官方包取，
          # 否则 App 启动时找不到 /data/app/.../lib/arm64/libproot.so。
          unzip -q -o /tmp/official.apk 'lib/arm64-v8a/*' -d /tmp/rtlib
          mkdir -p runtime/out/arm64-v8a/jniLibs/arm64-v8a
          for so in libproot.so libproot-loader.so libtalloc.so libandroid-shmem.so; do
            cp -a "/tmp/rtlib/lib/arm64-v8a/$so" runtime/out/arm64-v8a/jniLibs/arm64-v8a/
          done
          ls -lh runtime/out/arm64-v8a/jniLibs/arm64-v8a
          ls -lh runtime/out/arm64-v8a/assets/runtime

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build arm64 APK
        run: |
          chmod +x tooling/*.sh
          tooling/build-apk.sh -f arm64 --release

      - name: Show package id
        run: |
          APK=$(ls app/build/app/outputs/flutter-apk/app-arm64-release.apk)
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging "$APK" | sed -n '1p'

      - name: Publish as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-${{ github.run_number }}
          name: mod build ${{ github.run_number }}
          prerelease: true
          files: app/build/app/outputs/flutter-apk/app-arm64-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-mod-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          retention-days: 14
